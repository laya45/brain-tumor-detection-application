[project]
name = "brain-tumor-detection-application"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "Django==6.0.2",
    "tensorflow==2.21.0",
    "Pillow==12.0.0",
    "whitenoise==6.12.0",
    "dj-database-url==3.1.2",
    "psycopg2-binary==2.9.11",
    "vercel",
    "python-dotenv",
]

[tool.vercel.scripts]
build = "python manage.py migrate && python manage.py collectstatic --noinput"